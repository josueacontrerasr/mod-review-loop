name: Candidatos de sincronía vocal V-Slice

on:
  workflow_dispatch:
  push:
    paths:
      - 'mods/**/songs/**/*.ogg'
      - 'mods/**/data/songs/**/*.json'
      - 'tools/audio_sync_candidates.py'
      - 'tools/create_sync_input_manifests.py'
      - 'tools/validate_sync_candidates.py'
      - 'tools/run_all_sync_candidates.sh'
      - '.github/workflows/audio-sync-candidates.yml'

permissions:
  contents: read

concurrency:
  group: audio-sync-candidates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # El pipeline histórico de candidatos queda excluido de las ramas V2.6.2 y V2.6.3.
  candidates:
    # Este pipeline histórico no se ejecuta en la rama V2.7.2; el workflow
    # qa-playstate-vocal-freeplay-v272.yml valida sus candidatos vocales reales.
    if: github.ref_name != 'main' && github.ref_name != 'auto/si-te-vas-v262' && github.ref_name != 'auto/syllable-sync-v263' && github.ref_name != 'auto/fnf-vocal-sync-v272'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONHASHSEED: '0'
      WORKERS: '2'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias de análisis
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          python -m pip install 'numpy<2' scipy librosa
          ffmpeg -version
          python - <<'PY'
          import librosa, numpy, scipy
          print({'librosa': librosa.__version__, 'numpy': numpy.__version__, 'scipy': scipy.__version__})
          PY

      - name: Congelar entradas de audio final
        run: python tools/create_sync_input_manifests.py .

      - name: Generar candidatos sin modificar producción
        run: bash tools/run_all_sync_candidates.sh .

      - name: Validar aislamiento y contratos candidatos
        run: python tools/validate_sync_candidates.py .

      - name: Publicar evidencia para revisión humana
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audio-sync-candidates-${{ github.run_id }}
          path: |
            sync-candidates/**
          if-no-files-found: error
          retention-days: 30

      - name: Declarar política de no promoción automática
        run: |
          echo 'Los charts de producción y ZIPs no se modifican en este workflow.'
          echo 'La promoción requiere anclajes revisados, Audio Sync Test y playtest móvil documentados.'
