name: Publicar Release Esperón V-Slice V2.4.0

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag de Release'
        required: true
        default: 'esperon-vslice-086-v2.4.0'
      prerelease:
        description: 'Marcar como pre-release'
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  verify-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: python -m pip install --upgrade pip Pillow

      - name: Validar runtime V2.4.0
        run: python tools/validate_v240_runtime.py .

      - name: Reempaquetar ZIPs y colección V2.4.0 en el runner
        run: python tools/package_v240_fixed.py

      - name: Validar ZIPs V2.4.0
        run: python tools/validate_v240_zips.py

      - name: Comprobar evidencia de sincronía multimétodo
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('qa-lab/rebuild-v240')
          for name in ('freeplay-repair-v240.json', 'mixed-sync-v240.json', 'chart-promotion-v240.json', 'runtime-contract-v240.json', 'package-manifest-v240.json', 'zip-validation-v240.json', 'qa-20x20-v240.json', 'diagnose-freeplay-notes-v240.json'):
              data = json.loads((root / name).read_text())
              if data.get('status') != 'PASS':
                  raise SystemExit(f'{name} is not PASS')
          print('All V2.4.0 gates are PASS')
          PY

      - name: Publicar artefactos de auditoría
        uses: actions/upload-artifact@v4
        with:
          name: esperon-v240-qa-${{ github.run_id }}
          path: qa-lab/rebuild-v240/**
          if-no-files-found: error
          retention-days: 30

      - name: Crear Release y subir 21 ZIPs
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          notes='qa-lab/rebuild-v240/release-notes-v240.md'
          if [ ! -f "$notes" ]; then
            notes=/tmp/release-notes-v240.md
            printf '%s\n' '# Esperón V-Slice Mobile 0.8.6 — V2.4.0' '' '20 mods, 3 dificultades por canción, carátulas albumRoll corregidas y charts mixtos rítmico-vocales validados.' > "$notes"
          fi
          assets=(Mods\ .zip\ terminados/Mod-*-V2.4.0.zip)
          if [ "${#assets[@]}" -ne 21 ]; then
            echo "Se esperaban 21 ZIPs V2.4.0, se encontraron ${#assets[@]}" >&2
            exit 1
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" --title 'Esperón FNF Mobile V-Slice 0.8.6 V2.4.0' --notes-file "$notes" $([ "$PRERELEASE" = true ] && printf '%s' --prerelease)
          fi
