name: Auto evolución V-Slice

on:
  workflow_dispatch:
  schedule:
    - cron: '*/10 * * * *'

permissions:
  contents: write
  actions: read

concurrency:
  group: auto-evolucion-vslice
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias de validación
        run: python -m pip install --upgrade pip Pillow

      - name: Revisar ZIPs V-Slice sin tocar contenido musical
        run: python tools/auto_evolution.py --delivery-dir 'Mods .zip terminados' --history-dir dist/historico --output artifacts/reports

      - name: Validar charts candidatos, animaciones vocales, note styles y HUD V2 sin tocar contenido musical
        run: python tools/validate_sync_ui_v2.py .

      - name: Reconstruir colección solo si cambió un ZIP vigente
        run: python tools/build_master_collection_zip.py .

      - name: Publicar reportes de la ejecución
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auto-evolucion-${{ github.run_id }}
          path: |
            artifacts/reports/**
            artifacts/sync-ui-v2-validation.json
            artifacts/ui-audit/**
            Mods .zip terminados/*.zip
          if-no-files-found: warn
          retention-days: 30

      - name: Commit de ZIPs reparados y validados
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git add -- 'Mods .zip terminados' tools/auto_evolution.py
          # La colección grande se conserva como artifact/release; no bloquea commits por límite de blob.
          git reset -- 'Mods .zip terminados/Mod-Esperon-Coleccion-V*.zip' 2>/dev/null || true
          if git diff --cached --quiet; then
            echo 'No hay correcciones válidas que versionar.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          mapfile -t zips < <(git diff --cached --name-only -- 'Mods .zip terminados/*.zip')
          for zip in "${zips[@]}"; do
            base=$(basename "$zip" .zip)
            if [[ "$base" =~ ^(Mod-.+)-V([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
              git commit "$zip" -m "Versión ${BASH_REMATCH[2]} de ${BASH_REMATCH[1]} - revisión automática"
            fi
          done
          if ! git diff --cached --quiet; then
            git commit -m 'Revisión automática: cambios no musicales validados'
          fi
          git push
