name: Auto evolución V-Slice

on:
  workflow_dispatch:
  schedule:
    - cron: '*/10 * * * *'

permissions:
  contents: write
  actions: read

concurrency:
  group: auto-evolucion-vslice
  cancel-in-progress: false

jobs:
  # La evolución histórica V2.5.1 no debe mutar main ni la rama V2.6.3.
  review:
    if: github.ref_name != 'main' && github.ref_name != 'auto/syllable-sync-v263'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    
    env:
      EVOLUTION_UNTIL_CST: '2026-08-15T11:00:00-05:00'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias de validación
        run: python -m pip install --upgrade pip Pillow

      - name: Revisar ZIPs V-Slice sin tocar contenido musical
        run: python tools/auto_evolution.py --delivery-dir 'Mods .zip terminados' --history-dir dist/historico --output artifacts/reports

      - name: Validar charts candidatos, animaciones vocales, note styles y HUD V2 sin tocar contenido musical
        run: python tools/validate_sync_ui_v2.py .

      - name: Validar contrato runtime V2.5.1 de stages, personajes, note styles, álbumes y dificultades
        run: python tools/validate_v251_runtime.py .

      - name: Reempaquetar ZIPs y colección V2.5.1 en el runner
        run: python tools/package_v251_fixed.py

      - name: Validar ZIPs individuales y colección V2.5.1
        run: python tools/validate_v251_zips.py

      - name: Publicar reportes de la ejecución
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auto-evolucion-${{ github.run_id }}
          path: |
            artifacts/reports/**
            artifacts/sync-ui-v2-validation.json
            artifacts/ui-audit/**
            qa-lab/rebuild-v250/**
            sync-candidates/chart-vocal-comparisons/**
            sync-candidates/chart-vocal-candidate-comparisons/**
            sync-candidates/voice-aligned-charts/**
            sync-candidates/vocal-activity/**
            sync-candidates/vocal-stems/*/stem-evidence.json
            Mods .zip terminados/*.zip
          if-no-files-found: warn
          retention-days: 30

      - name: Commit de ZIPs reparados y validados
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git add -- 'Mods .zip terminados' tools/auto_evolution.py
          # La colección grande se conserva como artifact/release; no bloquea commits por límite de blob V2.5.1.
          git reset -- 'Mods .zip terminados/Mod-Esperon-Coleccion-V*.zip' 2>/dev/null || true
          if git diff --cached --quiet; then
            echo 'No hay correcciones válidas que versionar.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          mapfile -t zips < <(git diff --cached --name-only -- 'Mods .zip terminados/*.zip')
          for zip in "${zips[@]}"; do
            base=$(basename "$zip" .zip)
            if [[ "$base" =~ ^(Mod-.+)-V([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
              git commit "$zip" -m "Versión ${BASH_REMATCH[2]} de ${BASH_REMATCH[1]} - revisión automática"
            fi
          done
          if ! git diff --cached --quiet; then
            git commit -m 'Revisión automática: cambios no musicales validados'
          fi
          git push
